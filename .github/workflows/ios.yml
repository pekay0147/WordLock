name: iOS build

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iOS Simulator (no signing)
        working-directory: ios
        run: |
          xcodebuild -project WordLock.xcodeproj -scheme WordLock \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && { tail -n 20 build.log; exit 0; }
          # Surface compiler errors as annotations so they are readable without opening the log.
          grep -E "error:|error :" build.log | sort -u | head -n 40 | while IFS= read -r line; do
            echo "::error::${line//$'\n'/ }"
          done
          tail -n 60 build.log
          exit 1
